<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/defaultTemplate}">
<body>
	<main class="container" layout:fragment="content">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h1>Manage Products</h1>
			<a class="btn btn-success" th:href="@{/products/create}">+ New product</a>
		</div>
		<table class="table table-striped">
			<thead><tr><th>ID</th><th>SKU</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th><th></th></tr></thead>
			<tbody>
				<tr th:each="p : ${products}">
					<td th:text="${p.id}"></td>
					<td th:text="${p.sku}"></td>
					<td th:text="${p.name}"></td>
					<td th:text="${p.category.name}"></td>
					<td th:text="${#numbers.formatCurrency(p.price)}"></td>
					<td th:text="${p.stock}"></td>
					<td th:text="${p.active} ? 'Yes' : 'No'"></td>
					<td>
						<a class="btn btn-sm btn-outline-primary" th:href="@{/products/{id}(id=${p.id})}">View</a>
						<a class="btn btn-sm btn-outline-secondary" th:href="@{/products/update/{id}(id=${p.id})}">Edit</a>
						<a class="btn btn-sm btn-outline-danger" th:href="@{/products/delete/{id}(id=${p.id})}">Delete</a>
					</td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
