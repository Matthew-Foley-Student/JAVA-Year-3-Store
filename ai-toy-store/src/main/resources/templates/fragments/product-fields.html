<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<!-- form fields shared by create and update product -->
	<th:block th:fragment="fields">
		<div class="mb-3">
			<label class="form-label">SKU</label>
			<input type="text" class="form-control" th:field="*{sku}">
			<div class="text-danger small" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></div>
		</div>
		<div class="mb-3">
			<label class="form-label">Name</label>
			<input type="text" class="form-control" th:field="*{name}">
			<div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
		</div>
		<div class="mb-3">
			<label class="form-label">Category</label>
			<select class="form-select" th:field="*{categoryId}">
				<option value="">-- pick one --</option>
				<option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
			</select>
			<div class="text-danger small" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
		</div>
		<div class="mb-3">
			<label class="form-label">Description</label>
			<textarea class="form-control" rows="3" th:field="*{description}"></textarea>
		</div>
		<div class="row">
			<div class="col-md-6 mb-3">
				<label class="form-label">Price</label>
				<input type="number" step="0.01" class="form-control" th:field="*{price}">
				<div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
			</div>
			<div class="col-md-6 mb-3">
				<label class="form-label">Quantity in stock</label>
				<input type="number" class="form-control" th:field="*{quantity}">
				<div class="text-danger small" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
			</div>
		</div>
		<div class="form-check mb-3">
			<input type="checkbox" class="form-check-input" th:field="*{featured}">
			<label class="form-check-label">Featured on home page</label>
		</div>
	</th:block>
</body>
</html>
