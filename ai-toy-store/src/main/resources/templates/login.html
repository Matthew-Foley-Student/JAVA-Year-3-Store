<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/defaultTemplate}">
<body>
	<main class="container" layout:fragment="content">
		<h1>Login</h1>
		<form th:action="@{/login}" th:object="${loginForm}" method="post" style="max-width: 400px">
			<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
			<div class="mb-3">
				<label class="form-label">Email</label>
				<input type="email" class="form-control" th:field="*{email}">
				<div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label">Password</label>
				<input type="password" class="form-control" th:field="*{password}">
				<div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
			</div>
			<button class="btn btn-primary">Log in</button>
			<p class="mt-3">New here? <a th:href="@{/sign-up}">Create an account</a></p>
		</form>
	</main>
</body>
</html>
