<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/defaultTemplate}">
<body >
	
	<main class="container d-flex justify-content-center align-items-center"
	layout:fragment="content"
	style="min-height: 40vh;">
				<div class = "sign-in-window" >
		<h1>Welcome!</h1>
		<form th:action="@{/login}" th:object="${loginForm}" method="post" style="max-width: 400px">
			<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
			<div class="mb-3">
				<label class="form-label">Username or email</label>
				<input type="text" class="form-control" th:field="*{username}">
				<div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label">Password</label>
				<input type="password" class="form-control" th:field="*{password}">
				<div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
			</div>
			<button class="btn btn-primary">Log in</button>
			<p class="mt-3">New here? <a th:href="@{/sign-up}">Create an account</a></p>
		</form>
				</div>
	
	</main>
		
</body>
</html>
