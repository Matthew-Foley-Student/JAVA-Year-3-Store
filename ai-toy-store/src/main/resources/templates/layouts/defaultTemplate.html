<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<!-- main page layout (Thymeleaf Layout Dialect).
     Every page uses layout:decorate="~{layouts/defaultTemplate}" and puts its own content
     in <main layout:fragment="content">, so the head, nav and footer only live here. -->
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' | AI Toy Store'">AI Toy Store</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
	<div th:replace="~{fragments/header :: header}"></div>

	<main class="container flex-grow-1" layout:fragment="content">
		<p>Page content goes here.</p>
	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
