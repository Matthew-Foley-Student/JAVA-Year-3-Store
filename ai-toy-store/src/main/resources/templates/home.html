<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/defaultTemplate}">
<body>
	<main class="container" layout:fragment="content">
		<div class="p-5 mb-4 bg-light rounded-3">
			<h1>Your AI friend, wherever you go</h1>
			<p class="lead">Robot pets and dolls that talk, learn, and travel with you.</p>
			<a class="btn btn-primary" th:href="@{/shop}">Shop now</a>
			<a class="btn btn-outline-secondary" th:href="@{/sign-up}" th:if="${session.userId == null}">Sign up</a>
		</div>

		<h2>New Arrivals</h2>
		<div class="row row-cols-1 row-cols-md-4 g-3 mb-4">
			<div class="col" th:each="p : ${newArrivals}">
				<div class="card h-100">
					<div class="card-body">
						<h5 class="card-title" th:text="${p.name}">Product</h5>
						<p class="card-text text-muted small" th:text="${p.category.name}"></p>
						<p class="card-text fw-bold" th:text="${#numbers.formatCurrency(p.price)}"></p>
						<a class="btn btn-sm btn-outline-primary" th:href="@{/shop/item/{id}(id=${p.id})}">View</a>
					</div>
				</div>
			</div>
		</div>

		<th:block th:if="${!featured.isEmpty()}">
			<h2>Featured</h2>
			<div class="row row-cols-1 row-cols-md-4 g-3">
				<div class="col" th:each="p : ${featured}">
				<div class="card h-100">
					<div class="card-body">
						<h5 class="card-title" th:text="${p.name}">Product</h5>
						<p class="card-text text-muted small" th:text="${p.category.name}"></p>
						<p class="card-text fw-bold" th:text="${#numbers.formatCurrency(p.price)}"></p>
						<a class="btn btn-sm btn-outline-primary" th:href="@{/shop/item/{id}(id=${p.id})}">View</a>
					</div>
				</div>
			</div>
			</div>
		</th:block>
		<!-- TODO: events, announcements and polls once those tables are hooked up -->
	</main>
</body>
</html>
