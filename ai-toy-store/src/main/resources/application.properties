# MySQL connection (database script is in /database from Dominick)
spring.datasource.url=jdbc:mysql://localhost:3306/ai_toy_store
spring.datasource.username=root
# put your own local MySQL password here, don't commit it
spring.datasource.password=${DB_PASSWORD:}

# the tables already exist from the SQL scripts, so hibernate should not create or change them
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# lets the app start even when MySQL isn't running (Milestone 3 runs without a database).
# without these two lines Hibernate connects to MySQL at startup just to look up the version.
spring.jpa.database-platform=org.hibernate.dialect.MySQL57Dialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

spring.thymeleaf.cache=false

# Milestone 3: registration, login and products without a database (kept in memory).
# SpringConfig reads these to decide which service beans to create.
# Milestone 4: set both to false to use MySQL instead
app.users.in-memory=true
app.products.in-memory=true
