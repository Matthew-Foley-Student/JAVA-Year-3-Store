# MySQL connection (database script is in /database from Dominick)
spring.datasource.url=jdbc:mysql://localhost:3306/ai_toy_store
spring.datasource.username=root
# put your own local MySQL password here, don't commit it
spring.datasource.password=${DB_PASSWORD:}

# the tables already exist from the SQL scripts, so hibernate should not create or change them
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Milestone 2: registration and login without a database (users kept in memory)
# set this to false to save users in MySQL instead
app.users.in-memory=true
