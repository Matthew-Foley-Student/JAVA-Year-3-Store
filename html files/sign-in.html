
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftTech - Home</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HEADER ROW -->
    <div class="header-row">

        <!-- Logo -->
        <img class="logo"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-iKPMqwz7G27fyHxvGAEq2CkH1hW3PGaByP8YiP6VeA&s=10"
            alt="ShiftTech Logo">

        <!-- Navigation Bar -->
        <nav aria-label="NavBar">
            <ul class="pagination">

                <li class="page-item">
                    <a class="page-link" href="home.html">
                        Home
                    </a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="shop-default.html">
                        Shop
                    </a>
                </li>

                <!-- Cart Button -->
                <li class="page-item">
                    <button class="page-link cart-button"
                    type="button"
                    commandfor="drawerScrolling"
                    command="show-modal">
                        Cart
                    </button>
                </li>

                <li class="page-item">
                    <a class="page-link" href="about-us.html">
                        About Us
                    </a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="help-faqs.html">
                        Help/FAQs
                    </a>
                </li>

            </ul>
        </nav>

        <!-- Account Dropdown -->
        <div class="dropdown">

            <button
                class="btn btn-primary dropdown-toggle"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false">
                Account
            </button>

            <ul class="dropdown-menu">
                <li>
                    <a class="dropdown-item" href="sign-in.html">
                        Sign In
                    </a>
                </li>

                <li>
                    <a class="dropdown-item" href="account-settings.html">
                        Account Settings
                    </a>
                </li>

                <li>
                    <a class="dropdown-item" href="sign-up.html">
                        Sign up!
                    </a>
                </li>
            </ul>

        </div>

    </div>
    <!-- END HEADER ROW -->


    <!-- SHOPPING CART DRAWER -->
    <dialog class="drawer drawer-start"
            id="drawerScrolling"
            aria-labelledby="drawerScrollingLabel">

        <div class="drawer-header">

            <h5 class="drawer-title" id="drawerScrollingLabel">
                Shopping Cart
            </h5>

            <button
                type="button"
                class="btn-close"
                commandfor="drawerScrolling"
                command="close"
                aria-label="Close">
            </button>

        </div>

        <div class="drawer-body">

            <p>Your shopping cart is currently empty.</p>

        </div>

    </dialog>
    <!-- END SHOPPING CART DRAWER -->

            <!--Start of sign in window-->
            <br>
            <br>
            <br>
            <div class = "sign-in-window">
                <label for="userEmail" class="form-label mb-2">Email address</label>
                <input type="email" class="form-control" id="exampleFormControlInput" placeholder="name@example.com">
                <br>
                <div>
                <label for="password3" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password">
                <div class="strength-bar" data-bs-strength></div>
                </div>
                <br>
                <br>
                <button type="button" class="btn btn-primary input-button">Log in</button>
            </div>

            <!-- Bootstrap JavaScript: place before closing body tag -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
